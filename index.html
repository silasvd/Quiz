<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quiz PWA – Multiple-Choice-Quizzes direkt im Browser spielen." />
  <meta name="theme-color" content="#16213e" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <title>Quiz</title>
</head>
<body>
  <div id="app">

    <!-- ══════════════════════════════════════
         START SCREEN
    ══════════════════════════════════════ -->
    <section id="screen-start" class="screen" aria-label="Quiz auswählen">
      <div class="card">
        <header class="app-header">
          <div class="logo" aria-hidden="true">❓</div>
          <h1>Quiz</h1>
          <p>Wähle ein Quiz und teste dein Wissen!</p>
        </header>

        <div id="error-banner" class="error-banner" role="alert"></div>

        <!-- Repo quizzes -->
        <p class="section-label">Quiz aus dem Repository</p>
        <div id="quiz-list" class="quiz-list" role="listbox" aria-label="Verfügbare Quizzes"></div>

        <!-- Divider -->
        <div class="divider" aria-hidden="true">oder</div>

        <!-- File upload -->
        <p class="section-label">Eigene Quiz-Datei laden</p>
        <div
          id="upload-area"
          class="upload-area"
          role="button"
          tabindex="0"
          aria-label="JSON-Datei hochladen"
        >
          <div class="upload-icon" aria-hidden="true">📂</div>
          <p>Klicke oder ziehe eine <strong>.json</strong>-Datei hierher</p>
          <div id="upload-filename" class="upload-filename"></div>
        </div>
        <input type="file" id="file-input" accept=".json" aria-hidden="true" />

        <!-- Question count -->
        <p class="section-label">Anzahl der Fragen</p>
        <div class="count-row">
          <label for="question-count">Wie viele Fragen?</label>
          <div class="count-input-wrap">
            <button id="count-minus" class="count-btn" aria-label="Weniger Fragen">−</button>
            <input
              type="number"
              id="question-count"
              min="1"
              value="10"
              aria-label="Anzahl der Fragen"
            />
            <button id="count-plus" class="count-btn" aria-label="Mehr Fragen">+</button>
          </div>
          <span id="count-hint" class="count-hint" aria-live="polite"></span>
        </div>

        <button id="start-btn" class="btn-primary" disabled>Quiz starten</button>
      </div>
    </section>

    <!-- ══════════════════════════════════════
         QUIZ SCREEN
    ══════════════════════════════════════ -->
    <section id="screen-quiz" class="screen" aria-label="Quizfragen">
      <div class="card">
        <div class="quiz-header">
          <span id="quiz-title-bar" class="quiz-title-bar"></span>
          <span id="progress-text" class="progress-text" aria-live="polite"></span>
        </div>

        <div class="progress-bar-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>

        <p id="question-text" class="question-text"></p>

        <div id="options-list" class="options-list" role="group" aria-label="Antwortmöglichkeiten"></div>

        <!-- Feedback area -->
        <div id="feedback-area" class="feedback-area" style="display:none;" aria-live="assertive">
          <span id="feedback-icon" class="feedback-icon" aria-hidden="true"></span>
          <div class="feedback-text">
            <strong id="feedback-strong"></strong>
            <span id="feedback-correct-answer" class="correct-answer"></span>
          </div>
        </div>

        <!-- Next button -->
        <div id="next-btn-wrap" class="next-btn-wrap" style="display:none;">
          <button id="next-btn" class="btn-primary">Nächste Frage →</button>
        </div>
      </div>
    </section>

    <!-- ══════════════════════════════════════
         RESULT SCREEN
    ══════════════════════════════════════ -->
    <section id="screen-result" class="screen" aria-label="Auswertung">
      <div class="card">
        <div class="result-header">
          <span id="result-emoji" class="result-emoji" aria-hidden="true"></span>
          <h2 id="result-heading"></h2>
          <p id="result-subtitle"></p>
        </div>

        <div class="score-circle-wrap" aria-hidden="true">
          <div id="score-circle" class="score-circle" style="--pct: 0">
            <div class="score-text">
              <span id="score-num" class="score-num"></span>
              <span class="score-label">Richtig</span>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card correct">
            <span id="stat-correct" class="stat-value"></span>
            <span class="stat-key">Richtig ✅</span>
          </div>
          <div class="stat-card wrong">
            <span id="stat-wrong" class="stat-value"></span>
            <span class="stat-key">Falsch ❌</span>
          </div>
          <div class="stat-card total">
            <span id="stat-total" class="stat-value"></span>
            <span class="stat-key">Gesamt</span>
          </div>
        </div>

        <div class="result-actions">
          <button id="restart-btn" class="btn-primary">🔄 Nochmal spielen</button>
          <button id="back-btn" class="btn-secondary">← Zurück zur Auswahl</button>
        </div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
